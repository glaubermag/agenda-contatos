name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Atualizado para versão mais recente

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Usar Node.js 20 (LTS recomendado)
          cache: 'npm'  # Habilita cache para npm

      - name: Limpar dependências corrompidas
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm cache clean --force

      - name: Instalar dependências
        run: npm install

      - name: Build do projeto
        run: npm run build

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v4  # Versão atualizada
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
